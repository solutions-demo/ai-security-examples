[tool.poetry]
name = "scanner-benchmark-01"
version = "1.0.1"
description = "Text summarization helper"
authors = ["Benchmark <benchmark@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.8,<3.11"
transformers = "4.30.0"
pyyaml = "5.3"
requests = "2.19.0"
urllib3 = "1.24.1"
jinja2 = "2.10"
pillow = "8.2.0"
